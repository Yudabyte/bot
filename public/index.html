<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Embed Studio — Dashboard Pesan Discord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08071a; --ink:#ecebff; --mute:#9a97c4; --line:rgba(255,255,255,.09);
  --glass:rgba(255,255,255,.055); --glass2:rgba(255,255,255,.09);
  --neon:#a46bff; --neon2:#7c3aed; --blue:#2f8cff; --cyan:#35d6ff; --ok:#3ddc97; --bad:#ff5d7a;
  --dc-bg:#313338; --dc-embed:#2b2d31; --dc-text:#dbdee1; --dc-mute:#949ba4; --dc-link:#00a8fc; --dc-mention:#c9cdfb;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;z-index:0;border-radius:50%;filter:blur(110px);pointer-events:none}
body::before{width:520px;height:520px;left:-140px;top:-120px;background:radial-gradient(circle,#7c3aed 0%,transparent 70%);opacity:.55}
body::after{width:560px;height:560px;right:-160px;bottom:-160px;background:radial-gradient(circle,#2f8cff 0%,transparent 70%);opacity:.45}
#root{position:relative;z-index:1;min-height:100%}
h1,h2,h3{margin:0;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

.glass{background:var(--glass);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.btn{border:0;cursor:pointer;border-radius:12px;padding:10px 18px;font-weight:700;background:var(--glass2);border:1px solid var(--line);transition:.15s}
.btn:hover{background:rgba(255,255,255,.14)}
.btn.primary{background:linear-gradient(120deg,var(--neon2),var(--blue));border-color:transparent;box-shadow:0 8px 28px -8px rgba(124,58,237,.8)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.small{padding:6px 12px;font-size:13px;border-radius:9px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:clamp(20px,5vw,64px)}
.login-layout{width:100%;max-width:1080px;display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,.9fr);gap:clamp(28px,6vw,72px);align-items:center}
.login-intro{padding:clamp(8px,2vw,24px)}
.login-brand{display:inline-flex;align-items:center;gap:12px;padding:10px 16px 10px 10px;margin-bottom:36px}
.login-brand .logo{width:42px;height:42px;border-radius:14px;margin:0;box-shadow:var(--clay);font-size:20px}
.login-brand-title{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;letter-spacing:-.02em}
.login-brand-caption{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mute)}
.login-intro h1{max-width:560px;font-size:clamp(36px,5vw,58px);line-height:1.08;font-weight:700}
.login-intro>p{max-width:540px;color:var(--mute);font-size:16px;line-height:1.8;margin:18px 0 26px}
.login-feature-list{display:grid;gap:12px;max-width:540px}
.login-feature{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.78);box-shadow:var(--clay)}
.login-feature-icon{width:38px;height:38px;flex:none;border-radius:13px;display:grid;place-items:center;background:#dbe1ff;color:#004ac6;font-size:18px;font-weight:800}
.login-feature b{display:block;font-size:13px}
.login-feature span{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.login-card{width:100%;padding:clamp(28px,4vw,44px);text-align:left}
.login-card h2{font-family:'Space Grotesk',sans-serif;font-size:24px;letter-spacing:-.02em}
.login-card>p{color:var(--mute);margin:8px 0 24px;line-height:1.7}
.auth-switch{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:5px;margin-bottom:20px;border-radius:13px;background:var(--well);box-shadow:var(--well-sh)}
.auth-switch button{border:0;border-radius:10px;padding:10px;background:transparent;color:var(--mute);font-weight:700;cursor:pointer}
.auth-switch button.on{background:#fff;color:var(--ink);box-shadow:var(--clay)}
.auth-step{display:grid;gap:12px}
.auth-step .row{margin-bottom:0}
.auth-step .hint{margin:0}
.login-card .auth-step>p{margin:0}
.login-card .btn.discord{display:flex;align-items:center;justify-content:center;gap:12px;background:#5865f2;color:#fff;border:0;width:100%;padding:15px 18px;font-size:15px;text-decoration:none;box-shadow:0 12px 24px -8px rgba(88,101,242,.5),inset 0 1px 1px rgba(255,255,255,.4)}
.login-card .btn.discord:hover{background:#6b77ff;transform:translateY(-1px)}
.login-discord-mark{width:24px;height:24px;flex:none}
.login-security-note{display:flex;gap:10px;margin-top:18px;padding:14px;border-radius:14px;background:var(--well);box-shadow:var(--well-sh);color:var(--mute);font-size:12px;line-height:1.7}
.login-security-note b{color:var(--ink)}
.login-security-icon{color:var(--neon);font-size:16px;flex:none}
.login-card .login-setup-hint{font-size:12px;margin:18px 0 0;text-align:center}
.login-card .login-setup-hint strong{color:var(--ink)}
.login-footer{max-width:1080px;width:100%;margin-top:32px;text-align:center;color:var(--mute);font-size:11px}
@media(max-width:760px){
  .login{padding:24px 18px}
  .login-layout{grid-template-columns:1fr;gap:24px;max-width:520px}
  .login-intro{padding:0}
  .login-brand{margin-bottom:24px}
  .login-intro h1{font-size:clamp(34px,10vw,48px)}
  .login-intro>p{font-size:14px;margin:12px 0 18px}
  .login-feature-list{gap:8px}
  .login-feature{padding:11px 13px}
  .login-card{padding:26px 22px}
  .login-footer{margin-top:20px}
}

/* layout */
.top{display:flex;align-items:center;gap:14px;padding:16px 28px;border-bottom:1px solid var(--line);backdrop-filter:blur(14px);position:sticky;top:0;z-index:5;background:rgba(8,7,26,.6)}
.brand{font-weight:800;font-size:18px;display:flex;align-items:center;gap:10px}
.brand i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--neon),var(--blue));display:grid;place-items:center;font-style:normal;font-size:15px}
.spacer{flex:1}
.me{display:flex;align-items:center;gap:10px;font-weight:600}
.me img{width:32px;height:32px;border-radius:50%}
.profile-trigger{border:0;background:transparent;color:inherit;padding:4px 8px;border-radius:999px;cursor:pointer}
.profile-trigger:hover{background:rgba(37,99,235,.08)}
.wrap{width:100%;max-width:1800px;margin:0 auto;padding:clamp(20px,3vw,42px) clamp(18px,4vw,64px)}

/* guild picker */
.page-title{font-size:28px;font-weight:800;margin-bottom:6px}
.sub{color:var(--mute);margin:0 0 24px}
.guilds{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.guild{padding:20px;display:flex;flex-direction:column;gap:14px;cursor:pointer;transition:.18s;text-align:left;color:inherit}
.guild:hover{transform:translateY(-3px);border-color:rgba(164,107,255,.6);box-shadow:0 14px 40px -16px var(--neon)}
.gicon{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#3b2a78,#1d3b78);display:grid;place-items:center;font-weight:800;font-size:20px;overflow:hidden}
.gicon img{width:100%;height:100%;object-fit:cover}
.guild b{font-size:16px}
.guild small{color:var(--mute)}
.empty{padding:40px;text-align:center;color:var(--mute)}
.empty .btn{margin-top:16px}

/* studio */
.studio{display:grid;grid-template-columns:250px minmax(0,1fr);gap:clamp(18px,2vw,32px);align-items:start}
.side{padding:14px;position:sticky;top:84px}
.side .gname{display:flex;align-items:center;gap:10px;padding:6px 6px 14px;border-bottom:1px solid var(--line);margin-bottom:10px;font-weight:700}
.side .gname .gicon{width:36px;height:36px;border-radius:11px;font-size:14px;flex:none}
.tab{display:flex;width:100%;align-items:center;gap:10px;background:none;border:0;color:var(--mute);padding:10px 12px;border-radius:11px;cursor:pointer;font-weight:600;text-align:left}
.tab:hover{background:var(--glass)}
.tab.on{background:linear-gradient(120deg,rgba(124,58,237,.45),rgba(47,140,255,.3));color:#fff}
.back{margin-top:10px;width:100%}

.cols{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(360px,.85fr);gap:clamp(20px,2.4vw,36px);align-items:start}
.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.panel{padding:clamp(22px,2.2vw,34px)}
.panel h3{font-size:16px;margin-bottom:14px}
.row{display:grid;gap:6px;margin-bottom:14px}
.row label{font-weight:600;font-size:13px;color:var(--mute)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input[type=text],input[type=url],textarea,select{width:100%;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:11px;padding:10px 12px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--neon)}
textarea{resize:vertical;min-height:120px;line-height:1.65}
textarea[data-k="content"]{min-height:130px}
textarea[data-k="description"]{min-height:250px;font-size:15px;line-height:1.7}
select option{background:#14122e}
.sw{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sw input[type=color]{width:42px;height:38px;border:0;padding:0;background:none;cursor:pointer}
.chip{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.25);cursor:pointer;padding:0}
.chip.on{border-color:#fff}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
.toggle input{accent-color:var(--neon2);width:18px;height:18px}
.vars{display:flex;flex-wrap:wrap;gap:6px}
.var{background:rgba(164,107,255,.16);border:1px solid rgba(164,107,255,.35);color:#d6c2ff;border-radius:8px;padding:3px 9px;font-size:12px;cursor:pointer;font-family:ui-monospace,Consolas,monospace}
.var:hover{background:rgba(164,107,255,.32)}
.asset-grid{display:flex;flex-wrap:wrap;gap:7px;padding:10px;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.16);max-height:190px;overflow:auto}
.asset{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.06);padding:5px 8px;cursor:pointer;color:inherit;max-width:150px}
.asset:hover{background:rgba(164,107,255,.25);border-color:rgba(164,107,255,.65)}
.asset img{width:26px;height:26px;object-fit:contain;border-radius:5px}
.asset span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.dc-emoji{width:22px;height:22px;object-fit:contain;vertical-align:middle}
.media-preview{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.media-preview img{width:76px;height:54px;object-fit:cover;border-radius:7px;border:1px solid var(--line)}
.imgf{display:flex;gap:8px}
.card-in{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:rgba(0,0,0,.16)}
.hr{height:1px;background:var(--line);margin:18px 0}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* preview (gaya Discord) */
.preview{position:sticky;top:84px}
.dc{background:var(--dc-bg);border-radius:14px;padding:18px 16px;font-family:'gg sans','Plus Jakarta Sans',sans-serif;color:var(--dc-text);font-size:15px;box-shadow:0 20px 50px -20px #000}
.dc-msg{display:flex;gap:14px}
.dc-av{width:40px;height:40px;border-radius:50%;flex:none;background:linear-gradient(135deg,var(--neon2),var(--blue));overflow:hidden}
.dc-av img{width:100%;height:100%;object-fit:cover}
.dc-body{min-width:0;flex:1}
.dc-head{display:flex;gap:8px;align-items:center;margin-bottom:2px}
.dc-head b{color:#fff}
.dc-tag{background:#5865f2;color:#fff;font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px}
.dc-time{color:var(--dc-mute);font-size:12px}
.dc-txt{white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.mention{background:rgba(88,101,242,.3);color:var(--dc-mention);border-radius:4px;padding:0 3px}
.dc-embed{margin-top:6px;background:var(--dc-embed);border-left:4px solid var(--neon);border-radius:4px;padding:10px 14px 14px;max-width:440px;display:grid;gap:8px;position:relative}
.dc-embed .au{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#fff}
.dc-embed .au img{width:22px;height:22px;border-radius:50%}
.dc-embed .ti{font-weight:700;color:#fff;font-size:16px}
.dc-embed .ti.lnk{color:var(--dc-link)}
.dc-embed .de{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.dc-embed .th{position:absolute;right:12px;top:12px;width:70px;height:70px;border-radius:6px;object-fit:cover}
.dc-embed.hasth .au,.dc-embed.hasth .ti,.dc-embed.hasth .de{padding-right:84px}
.dc-embed .big{width:100%;border-radius:6px;max-height:260px;object-fit:cover}
.dc-embed .fl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dc-embed .f{grid-column:1/-1;font-size:14px}
.dc-embed .f.inl{grid-column:auto}
.dc-embed .f b{display:block;color:#fff;font-size:13.5px}
.dc-embed .ft{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dc-mute)}
.dc-embed .ft img{width:18px;height:18px;border-radius:50%}
.dc-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.dc-btn{background:#4e5058;color:#fff;border-radius:4px;padding:6px 14px;font-size:13.5px;font-weight:500}
.dc-btn .dc-emoji{width:18px;height:18px;margin-right:5px;vertical-align:-4px}
.hint{color:var(--mute);font-size:12.5px;margin-top:10px}
code.i{background:rgba(255,255,255,.1);padding:0 5px;border-radius:5px}

/* module + templates */
.modhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.tpl{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.tpl b{flex:1}
.preset-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:14px 0 22px}
.preset{position:relative;overflow:hidden;padding:16px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(135deg,rgba(255,255,255,.075),rgba(255,255,255,.025));cursor:pointer;text-align:left;transition:.18s;color:inherit}
.preset::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--preset-color,var(--neon))}
.preset:hover{transform:translateY(-3px);border-color:rgba(164,107,255,.65);box-shadow:0 14px 30px -18px var(--neon)}
.preset b{display:block;font-size:14px;margin-bottom:5px}
.preset small{display:block;color:var(--mute);line-height:1.45}
.preset .badge{display:inline-block;margin-top:10px;color:#d9ccff;background:rgba(164,107,255,.16);border-radius:999px;padding:3px 8px;font-size:11px}
.section-title{display:flex;align-items:center;gap:10px;margin:22px 0 10px}
.section-title h3{margin:0}
.section-title span{color:var(--mute);font-size:12px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);padding:12px 20px;border-radius:12px;font-weight:600;z-index:50;backdrop-filter:blur(14px);border:1px solid var(--line);animation:pop .2s ease-out}
.toast.ok{background:rgba(61,220,151,.18);color:var(--ok)}
.toast.err{background:rgba(255,93,122,.18);color:var(--bad)}
.modal-backdrop{position:fixed;inset:0;background:rgba(3,2,15,.72);backdrop-filter:blur(8px);z-index:40;display:grid;place-items:center;padding:20px}
.modal{width:min(560px,100%);padding:24px;box-shadow:0 24px 80px -25px #000}
.modal h3{font-size:20px;margin-bottom:7px}
.modal p{color:var(--mute);margin:0 0 16px}
.share-row{display:flex;gap:8px;align-items:center}
.share-row input{flex:1;min-width:0}
@keyframes pop{from{transform:translate(-50%,10px);opacity:0}}
.loading{min-height:100vh;display:grid;place-items:center;color:var(--mute)}

@media (max-width:1000px){
  .studio{grid-template-columns:1fr}.side{position:static}
  .side nav{display:flex;gap:6px;overflow-x:auto}.tab{white-space:nowrap;width:auto}
  .cols{grid-template-columns:1fr}.settings-grid{grid-template-columns:1fr}.preview{position:static}
  .wrap{padding:18px}.top{padding:14px 18px}
}
@media (min-width:1500px){
  .studio{grid-template-columns:270px minmax(0,1fr)}
  .panel{padding:32px}
  .dc-embed{max-width:620px}
}
@media (max-width:640px){
  body{font-size:14px}
  .profile-trigger{gap:6px;padding:4px}
    .profile-trigger span{max-width:72px;overflow:hidden;text-overflow:ellipsis}
    .profile-page{padding:18px 14px!important}
    .profile-layout{grid-template-columns:1fr!important}
    .profile-forms{grid-template-columns:1fr!important}
    .profile-hero{padding:24px!important}
  .wrap{padding:14px 12px}
  .top{padding:12px 14px}
  .top .me{max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .studio{gap:14px}
  .side{padding:10px;border-radius:14px}
  .side .gname{padding-bottom:10px}
  .panel{padding:16px;border-radius:14px}
  .two{grid-template-columns:1fr}
  .actions .btn{flex:1 1 auto}
  textarea[data-k="description"]{min-height:210px}
  .preview{min-width:0}
  .dc{padding:14px 12px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ========== EMBED STUDIO — CLAY SKIN ========== */
:root{
  --bg:#faf8ff; --ink:#131b2e; --mute:#434655; --line:rgba(195,198,215,.55);
  --glass:#ffffff; --glass2:#eaedff;
  --neon:#2563eb; --neon2:#1d4ed8; --blue:#3b82f6; --cyan:#004ac6; --ok:#16a34a; --bad:#ba1a1a;
  --clay:0 10px 25px -5px rgba(37,99,235,.08),0 8px 10px -6px rgba(15,23,42,.04),inset 0 2px 2px rgba(255,255,255,.95),inset 0 -2px 4px rgba(148,163,184,.15);
  --well:#F1F5F9; --well-sh:inset 0 2px 4px rgba(15,23,42,.06),inset 0 1px 2px rgba(37,99,235,.04),0 1px 1px rgba(255,255,255,.8);
}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
body::before{content:"";inset:auto;left:-120px;top:-100px;width:420px;height:420px;border-radius:50%;filter:blur(90px);opacity:.8;background:#dbe1ff}
body::after{content:"";inset:auto;right:-140px;bottom:-140px;width:460px;height:460px;border-radius:50%;filter:blur(100px);opacity:.6;background:#c4e7ff}
h1,h2,h3,.brand,.tab,.page-title,.login-card h1{font-family:'Space Grotesk',sans-serif}

/* top bar */
.top{background:rgba(255,255,255,.85);border-bottom:0;box-shadow:0 1px 8px rgba(37,99,235,.08);font-family:'Plus Jakarta Sans',sans-serif}
.brand{text-transform:none;letter-spacing:-.01em;font-size:19px}
.brand i{border-radius:12px;background:linear-gradient(180deg,#3b82f6,#1d4ed8);color:#fff;box-shadow:0 8px 16px -2px rgba(37,99,235,.3),inset 0 2px 2px rgba(255,255,255,.7),inset 0 -2px 4px rgba(0,0,0,.2)}
.me img{border:2px solid #fff;box-shadow:var(--clay)}

/* cards */
.glass{background:#fff;border:0;border-radius:16px;box-shadow:var(--clay);backdrop-filter:none;-webkit-backdrop-filter:none}
.glass.panel::before,.glass.panel::after{display:none}
.panel h3,.preview>h3{font-family:'Space Grotesk',sans-serif;font-size:18px;color:var(--ink);text-shadow:none;letter-spacing:-.01em}
.panel h3::before,.preview>h3::before,.row label::before{content:none}
.page-title,.login-card h1{text-shadow:none;font-size:32px;letter-spacing:-.025em}
.sub,.guild small,.hint,.row label{font-family:'Plus Jakarta Sans',sans-serif}
.row label{color:var(--ink);letter-spacing:0}
.hint{color:#737686}
code.i{background:#eaedff;color:var(--cyan)}

/* buttons */
.btn{font-family:'Plus Jakarta Sans',sans-serif;border:0;border-radius:12px;background:#fff;color:var(--ink);box-shadow:var(--clay);transition:.15s}
.btn:hover{background:#f2f3ff;box-shadow:var(--clay)}
.btn:active{transform:translateY(1.5px)}

const { useState, useEffect, useRef, useMemo } = React;

async function api(path, opts = {}) {
  const isForm = opts.body instanceof FormData;
  let r;
  try {
    r = await fetch(path, {
      credentials: 'same-origin',
      ...opts,
      headers: opts.body && !isForm ? { 'Content-Type': 'application/json' } : undefined,
      body: opts.body && !isForm ? JSON.stringify(opts.body) : opts.body,
    });
  } catch (error) {
    if (error instanceof TypeError) {
      throw new Error(`Tidak dapat menghubungi server Embed Studio di ${location.origin}. Pastikan server berjalan dengan npm start, lalu muat ulang halaman.`);
    }
    throw error;
  }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Terjadi kesalahan');
  return j;
}

function SecretInput({ label, ...props }) {
  const [visible, setVisible] = useState(false);
  return (
    <div className="secret-field">
      <input {...props} type={visible ? 'text' : 'password'} />
      <button
        className="secret-toggle"
        type="button"
        aria-label={`${visible ? 'Sembunyikan' : 'Tampilkan'} ${label}`}
        aria-pressed={visible}
        title={`${visible ? 'Sembunyikan' : 'Tampilkan'} ${label}`}
        onClick={() => setVisible((current) => !current)}
      >
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          {visible ? <>
            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" />
            <circle cx="12" cy="12" r="3" />
          </> : <>
            <path d="M3 3l18 18M10.6 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a14.8 14.8 0 0 1-3.1 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1 0 1.9-.2 2.8-.5" />
            <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
          </>}
        </svg>
      </button>
    </div>
  );
}

function DiscordBotIntentGuide({ clientId }) {

/* ---------- Preview ---------- */
const esc = (s) => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function md(text) {
  let t = esc(text);
  t = t.replace(/`([^`\n]+)`/g, '<code class="i">$1</code>')
       .replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
       .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>')
       .replace(/__([^_\n]+)__/g, '<u>$1</u>')
       .replace(/~~([^~\n]+)~~/g, '<s>$1</s>')
       .replace(/&lt;(a?):([a-zA-Z0-9_~]+):(\d+)&gt;/g, (_, a, name, id) => `<img class="dc-emoji" src="https://cdn.discordapp.com/emojis/${id}.${a ? 'gif' : 'png'}?size=48" alt=":${name}:" />`)
       .replace(/\u0001([^\u0002]+)\u0002/g, '<span class="mention">$1</span>');
  return { __html: t };
}

function Preview({ message, ctx }) {
  const sub = (s) => (s || '').replace(/\{([a-zA-Z.]+)\}/g, (m, k) => (k in ctx ? ctx[k] : m));
  const imgSrc = (s) => { const v = sub(s).trim(); return /^(https?:\/\/|\/uploads\/)/.test(v) ? v : ''; };
  const e = message.embed || {};
  const has = e.enabled;
  const th = has ? imgSrc(e.thumbnail) : '';
  const big = has ? imgSrc(e.image) : '';
  const au = has ? imgSrc(e.authorIcon) : '';
  const fi = has ? imgSrc(e.footerIcon) : '';
  const now = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
  const buttonEmoji = (button) => button.emoji?.id ? `https://cdn.discordapp.com/emojis/${button.emoji.id}.${button.emoji.animated ? 'gif' : 'png'}?size=32` : '';
  return (
    <div className="dc">
      <div className="dc-msg">
        <div className="dc-av">{ctx.botAvatar && <img src={ctx.botAvatar} alt="" />}</div>
        <div className="dc-body">
          <div className="dc-head"><b>{ctx['bot.name']}</b><span className="dc-tag">APP</span><span className="dc-time">Hari ini pukul {now}</span></div>
          {message.content && <div className="dc-txt" dangerouslySetInnerHTML={md(sub(message.content))} />}
          {(message.stickers || []).length > 0 && <div className="media-preview">{message.stickers.slice(0, 3).map((s) => <img key={s.id || s} src={s.url || ''} alt={s.name || 'sticker'} style={{ width: 160, height: 160, objectFit: 'contain' }} />)}</div>}
          {has && (
            <div className={'dc-embed' + (th ? ' hasth' : '')} style={{ borderLeftColor: e.color || '#8b5cf6' }}>
              {sub(e.authorName) && <div className="au">{au && <img src={au} alt="" />}<span>{sub(e.authorName)}</span></div>}
              {sub(e.title) && <div className={'ti' + (sub(e.titleUrl) ? ' lnk' : '')}>{sub(e.title)}</div>}
              {sub(e.description) && <div className="de" dangerouslySetInnerHTML={md(sub(e.description))} />}
              {th && <img className="th" src={th} alt="" />}
              {(e.fields || []).some((f) => f.name && f.value) && (
                <div className="fl">
                  {e.fields.filter((f) => f.name && f.value).map((f, i) => (
                    <div key={i} className={'f' + (f.inline ? ' inl' : '')}><b>{sub(f.name)}</b><span dangerouslySetInnerHTML={md(sub(f.value))} /></div>
                  ))}
                </div>
              )}
              {big && <img className="big" src={big} alt="" />}
              {(sub(e.footerText) || e.timestamp) && (
                <div className="ft">{fi && <img src={fi} alt="" />}<span>{sub(e.footerText)}{sub(e.footerText) && e.timestamp ? ' • ' : ''}{e.timestamp ? 'Hari ini pukul ' + now : ''}</span></div>
              )}
            </div>
          )}
          {((message.buttons || []).some((b) => b.label && b.url) || (message.previewActions || []).length > 0) && (
            <div className="dc-btns">
              {(message.buttons || []).filter((b) => b.label && b.url).map((b, i) => <span className="dc-btn" key={`link-${i}`}>{buttonEmoji(b) && <img className="dc-emoji" src={buttonEmoji(b)} alt="" />}{sub(b.label)} ↗</span>)}
              {(message.previewActions || []).map((label, i) => <span className="dc-btn" key={`action-${i}`}>{label}</span>)}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function InviteDialog({ url, appUrl, onClose, toast }) {
  const copyLink = async (link, label) => {
    try { await navigator.clipboard.writeText(link); toast(`Link ${label} berhasil disalin`, 'ok'); }
    catch { toast(`Gagal menyalin link ${label}. Salin manual dari kotak link.`, 'err'); }
  };
  const shareLink = async (link, label, text) => {
    if (navigator.share) {
      try {
        await navigator.share({ title: label, text, url: link });
        return;
      } catch (error) {
        if (error.name === 'AbortError') return;
      }
    }
    await copyLink(link, label);
  };
  return <div className="modal-backdrop" onMouseDown={(e) => e.target === e.currentTarget && onClose()}>
    <div className="glass modal" role="dialog" aria-modal="true" aria-labelledby="invite-title">
      <div className="section-title" style={{ marginTop: 0 }}><h3 id="invite-title">Undang atau tambahkan aplikasi</h3><span>Dua jenis pemasangan Discord</span></div>
      <div className="card-in" style={{ marginBottom: 14 }}>
        <b>Link yang dibagikan harus dimulai dengan https://discord.com/</b>
        <p className="hint" style={{ marginBottom: 0 }}>Jangan kirim alamat Embed Studio seperti <code>http://127.0.0.1:3198/invite</code> atau <code>/app-install</code>. Alamat 127.0.0.1 hanya berlaku di perangkatmu. Gunakan tombol Bagikan atau Salin pada tautan Discord di bawah.</p>
      </div>
      <div className="card-in">
        <b>1. Undang bot ke server</b>
        <p className="hint">Bot dipasang sebagai anggota server. Pilih server yang kamu kelola dan setujui izinnya.</p>
        <div className="share-row"><input type="url" value={url} readOnly aria-label="Link undangan bot ke server" /><button className="btn primary" onClick={() => copyLink(url, 'undangan server')}>Salin</button></div>
        <div className="actions" style={{ marginTop: 8 }}>
          <a className="btn small primary" href={url} target="_blank" rel="noreferrer">Undang bot ke server</a>
          <button className="btn small" type="button" onClick={() => shareLink(url, 'undangan server', 'Tambahkan bot ini sebagai anggota server Discord:')}>Bagikan ke HP</button>
        </div>
      </div>
      <div className="glass panel" style={{ marginTop: 16, padding: 14 }}>
        <b>2. Tambahkan aplikasi ke akun pengguna</b>
        <p className="hint" style={{ margin: '6px 0 10px' }}>Aplikasi dan command tersedia untuk akun Discord pengguna tanpa memasang bot sebagai anggota server. Aktifkan User Install pada Developer Portal → Installation.</p>
        <div className="share-row"><input type="url" value={appUrl} readOnly aria-label="Link tambah aplikasi ke akun Discord" /><button className="btn" onClick={() => copyLink(appUrl, 'aplikasi pengguna')}>Salin</button></div>
        <div className="actions" style={{ marginTop: 8 }}>
          <a className="btn small" href={appUrl} target="_blank" rel="noreferrer">Tambah aplikasi ke akun Discord</a>
          <button className="btn small" type="button" onClick={() => shareLink(appUrl, 'aplikasi pengguna', 'Tambahkan aplikasi ini ke akun Discord kamu:')}>Bagikan ke HP</button>
        </div>
      </div>
      <div className="actions" style={{ marginTop: 16 }}><span className="hint">Tautan Discord langsung — bisa dikirim lewat WhatsApp, SMS, atau aplikasi lain.</span><span className="spacer" /><button className="btn small" onClick={onClose}>Tutup</button></div>
    </div>
  </div>;
}

function EmojiManager({ guilds, toast }) {
  const available = (guilds?.guilds || []).filter((guild) => guild.botIn);
  const [guildId, setGuildId] = useState('');
  const [source, setSource] = useState('');
  const [name, setName] = useState('');
  const [busy, setBusy] = useState(false);
  const valid = guildId && source.trim();
  const add = async () => {
    if (!valid) return toast('Pilih server dan tempel URL atau emoji Discord', 'err');
    setBusy(true);
    try {
      const result = await api(`/api/guilds/${guildId}/emojis`, { method: 'POST', body: { source: source.trim(), name: name.trim() } });
      toast(`Emoji ${result.emoji.format} berhasil ditambahkan`, 'ok');
      setSource(''); setName('');
    } catch (e) { toast(e.message, 'err'); }
    setBusy(false);
  };
  return (
    <div className="glass panel lobby-tool">
      <div className="modhead"><div><h3 style={{ margin: 0 }}>Tambah emoji server</h3><span className="hint">Tempel URL PNG/GIF/WEBP atau format emoji Discord, lalu pilih server tujuan.</span></div><span className="badge">MANAGE EXPRESSIONS</span></div>
      <div className="two">
        <div className="row"><label>Server tujuan</label><select value={guildId} onChange={(e) => setGuildId(e.target.value)}><option value="">Pilih server yang sudah memasang bot…</option>{available.map((guild) => <option key={guild.id} value={guild.id}>{guild.name}</option>)}</select></div>
        <div className="row"><label>Nama emoji (opsional)</label><input type="text" value={name} onChange={(e) => setName(e.target.value)} placeholder="contoh: verified_daxia" maxLength="32" /></div>
      </div>
      <div className="row"><label>URL gambar / emoji Discord</label><input type="url" value={source} onChange={(e) => setSource(e.target.value)} placeholder="https://cdn.discordapp.com/emojis/…?size=44&animated=true" /></div>
      <div className="actions"><button className="btn primary" disabled={!valid || busy} onClick={add}>{busy ? 'Menambahkan…' : 'Tambah ke server'}</button><span className="hint">Bot harus punya izin Kelola Ekspresi dan gambar harus bisa diakses publik.</span></div>
      {!available.length && <div className="empty">Belum ada server yang memasang bot. Tambahkan bot dulu agar emoji bisa dibuat.</div>}
    </div>
  );
}

function ImageField({ value, onChange, k, toast }) {
  const ref = useRef();
  const up = async (file) => {
    if (!file) return;
    const fd = new FormData(); fd.append('file', file);
    try { const r = await api('/api/upload', { method: 'POST', body: fd }); onChange(r.url); toast('Gambar terunggah', 'ok'); }
    catch (e) { toast(e.message, 'err'); }
  };
  return (
    <div className="imgf">
      <input type="text" data-k={k} value={value} onChange={(e) => onChange(e.target.value)} placeholder="https://… atau {user.avatar}" />
      <button type="button" className="btn small" onClick={() => ref.current.click()}>Unggah</button>
      <input ref={ref} type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden onChange={(e) => { up(e.target.files[0]); e.target.value = ''; }} />
    </div>
  );
}

function Editor({ message, onChange, toast, assets }) {
  const e = message.embed;
  const setE = (patch) => onChange({ ...message, embed: { ...e, ...patch } });
  const setM = (patch) => onChange({ ...message, ...patch });

  // Sisipkan teks di posisi kursor kolom yang sedang aktif.
  const insertText = (v) => {
    const el = document.activeElement;
    const key = el && el.dataset && el.dataset.k;
    if (key && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA')) {
      const pos = el.selectionStart ?? el.value.length;
      const next = el.value.slice(0, pos) + v + el.value.slice(el.selectionEnd ?? pos);
      if (key === 'content') setM({ content: next });
      else setE({ [key]: next });
      requestAnimationFrame(() => { el.focus(); el.setSelectionRange(pos + v.length, pos + v.length); });
    } else {
      setE({ description: (e.description || '') + v });
    }
  };
  const insertVar = (v) => insertText(v);

  const setField = (i, patch) => setE({ fields: e.fields.map((f, j) => (j === i ? { ...f, ...patch } : f)) });
  const setBtn = (i, patch) => setM({ buttons: message.buttons.map((b, j) => (j === i ? { ...b, ...patch } : b)) });

  return (
    <div className="glass panel">
      <h3>Isi pesan</h3>
      <div className="row">
        <label>Variabel (klik untuk menyisipkan di kolom yang sedang aktif)</label>
        <div className="vars">{VARIABLES.map((v) => <button type="button" key={v} className="var" onMouseDown={(ev) => ev.preventDefault()} onClick={() => insertVar(v)}>{v}</button>)}</div>
      </div>
      <div className="row">
        <label>Teks di atas embed (opsional)</label>
        <textarea data-k="content" value={message.content} onChange={(ev) => setM({ content: ev.target.value })} placeholder="Contoh: Halo {user.mention}!" />
      </div>
      <div className="row">
        <label>Emoji server (klik untuk menambahkan ke teks)</label>
        <div className="asset-grid">
          {(assets?.emojis || []).map((emoji) => <button type="button" className="asset" key={emoji.id} title={emoji.format} onMouseDown={(ev) => ev.preventDefault()} onClick={() => insertText(emoji.format)}><img src={emoji.url} alt={emoji.format} /><span>{emoji.name}</span></button>)}
          {!assets?.emojis?.length && <span className="hint">Belum ada emoji custom di server ini.</span>}
        </div>
      </div>
      <div className="row">
        <label>Sticker server (maksimal 3 per pesan)</label>
        <div className="asset-grid">
          {(assets?.stickers || []).map((sticker) => {
            const selected = (message.stickers || []).some((s) => (s.id || s) === sticker.id);
            return <button type="button" className="asset" key={sticker.id} title={sticker.description || sticker.name} disabled={selected || (message.stickers || []).length >= 3} onClick={() => setM({ stickers: [...(message.stickers || []), sticker] })}><img src={sticker.url} alt={sticker.name} /><span>{selected ? '✓ ' : ''}{sticker.name}</span></button>;
          })}
          {!assets?.stickers?.length && <span className="hint">Belum ada sticker server yang bisa dipakai.</span>}
        </div>
        {(message.stickers || []).length > 0 && <div className="actions" style={{ marginTop: 8 }}>{message.stickers.map((sticker, i) => <button type="button" className="btn small danger" key={sticker.id || i} onClick={() => setM({ stickers: message.stickers.filter((_, j) => j !== i) })}>Hapus {sticker.name || 'sticker'}</button>)}</div>}
      </div>
      <div className="row">
        <label>GIF / PNG / gambar di pesan</label>
        {(message.media || []).map((item, i) => <div className="card-in" key={i}>
          <ImageField k={'media-' + i} value={item.url} onChange={(url) => setM({ media: message.media.map((m, j) => j === i ? { ...m, url } : m) })} toast={toast} />
          <div className="two" style={{ marginTop: 8 }}>
            <select value={item.position || 'message'} onChange={(ev) => setM({ media: message.media.map((m, j) => j === i ? { ...m, position: ev.target.value } : m) })}>
              <option value="message">Media terpisah di pesan</option>

              <option value="thumbnail">Thumbnail kanan atas</option>
            </select>
            <button type="button" className="btn small danger" onClick={() => setM({ media: message.media.filter((_, j) => j !== i) })}>Hapus media</button>
          </div>
        </div>)}
        {(message.media || []).length < 10 && <button type="button" className="btn small" onClick={() => setM({ media: [...(message.media || []), { url: '' }] })}>Tambah GIF / PNG</button>}
        <span className="hint">Bisa tempel URL https:// atau unggah file GIF, PNG, JPG, WEBP maksimal 8 MB.</span>

        </div>
        <div className="two">

      </>)}

      <div className="hr" />
      <h3>Tombol tautan</h3>
      {message.buttons.map((b, i) => (
        <div className="card-in" key={i}>

          <div className="row" style={{ marginTop: 10, marginBottom: 0 }}>
            <label>Ikon tombol (emoji server)</label>

              <option value="">Tanpa ikon</option>
              {(assets?.emojis || []).map((emoji) => <option key={emoji.id} value={emoji.id}>{emoji.animated ? 'GIF emoji' : 'Emoji'} — {emoji.name}</option>)}
            </select>
            <span className="hint">Discord hanya menerima emoji pada ikon tombol. GIF/sticker tidak bisa menjadi ikon tombol native.</span>
          </div>
          <div style={{ marginTop: 8 }}><button type="button" className="btn small danger" onClick={() => setM({ buttons: message.buttons.filter((_, j) => j !== i) })}>Hapus</button></div>
        </div>
      ))}
      {message.buttons.length < 5 && <button type="button" className="btn small" onClick={() => setM({ buttons: [...message.buttons, { label: '', url: '' }] })}>Tambah tombol</button>}
    </div>
  );
}

function BroadcastTab({ allGuilds, message, setMessage, ctx, toast, assets }) {
  const botGuilds = (allGuilds || []).filter((g) => g.botIn);
  const [selected, setSelected] = useState({});
  const [channelMap, setChannelMap] = useState({});
  const [busy, setBusy] = useState(false);
  const toggle = (id) => setSelected((current) => {
    const next = { ...current };
    if (next[id] !== undefined) delete next[id]; else next[id] = '';
    return next;
  });
  useEffect(() => {
    Object.keys(selected).forEach((id) => {
      if (!channelMap[id]) api(`/api/guilds/${id}/channels`).then((r) => setChannelMap((current) => ({ ...current, [id]: r.channels }))).catch((e) => toast(e.message, 'err'));
    });
  }, [selected]);
  const send = async () => {
    const targets = Object.entries(selected).filter(([, channelId]) => channelId).map(([guildId, channelId]) => ({ guildId, channelId }));
    if (!targets.length) return toast('Pilih server dan channel tujuan', 'err');
    setBusy(true);
    try { const result = await api('/api/broadcast', { method: 'POST', body: { targets, message } }); toast(`${result.results.filter((item) => item.ok).length} tujuan berhasil dikirimi`, result.ok ? 'ok' : 'err'); }
    catch (e) { toast(e.message, 'err'); }
    setBusy(false);
  };
  return (
    <div className="cols">
      <div>
        <div className="glass panel" style={{ marginBottom: 20 }}>
          <div className="modhead"><div><h3 style={{ margin: 0 }}>Broadcast lintas server</h3><span className="hint">Kirim satu pesan ke banyak server yang memasang bot.</span></div><span className="spacer" /><button className="btn primary" disabled={busy} onClick={send}>{busy ? 'Mengirim…' : 'Kirim ke semua pilihan'}</button></div>
          <div className="actions" style={{ marginBottom: 12 }}><button className="btn small" onClick={() => setSelected(Object.fromEntries(botGuilds.map((g) => [g.id, selected[g.id] || ''])))}>Pilih semua server</button><button className="btn small" onClick={() => setSelected({})}>Kosongkan</button><span className="hint">{Object.keys(selected).length} server dipilih</span></div>
          <div className="broadcast-list">
            {botGuilds.map((g) => <div className="card-in" key={g.id}>
              <label className="toggle"><input type="checkbox" checked={selected[g.id] !== undefined} onChange={() => toggle(g.id)} /> {g.name}</label>
              {selected[g.id] !== undefined && <select style={{ marginTop: 8 }} value={selected[g.id]} onChange={(e) => setSelected((current) => ({ ...current, [g.id]: e.target.value }))}><option value="">Pilih channel tujuan…</option>{(channelMap[g.id] || []).map((c) => <option key={c.id} value={c.id}>#{c.name}</option>)}</select>}
            </div>)}
            {!botGuilds.length && <div className="empty">Belum ada server yang memasang bot.</div>}
          </div>
        </div>
        <Editor message={message} onChange={setMessage} toast={toast} assets={assets} />
      </div>
      <div className="preview"><h3 style={{ marginBottom: 12 }}>Pratinjau broadcast</h3><Preview message={message} ctx={ctx} /><p className="hint">Pesan akan memakai data masing-masing server saat dikirim.</p></div>
    </div>
  );
}

function CommandMessagesTab({ me, toast }) {
  const [config, setConfig] = useState(null);
  const [busy, setBusy] = useState(false);
  const assets = { emojis: [], stickers: [] };
  const ctx = {
    'server.name': 'server saat command digunakan',
    'server.id': 'ID server saat command digunakan',
    'server.memberCount': '—',
    'server.icon': '',
    'user.name': me.username,
    'user.mention': '\u0001@' + me.username + '\u0002',
    'user.id': me.id,
    'user.roles': 'Data role terbatas',
    'user.roleNames': 'Data role terbatas',
    'user.highestRole': 'Data role terbatas',
    'user.avatar': me.avatar,
    'channel.name': 'channel tempat command digunakan',
    'channel.mention': '\u0001#channel\u0002',
    'bot.name': 'Bot',
    date: new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }),
    time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }),
  };

  useEffect(() => {
    api('/api/command-messages')
      .then((result) => setConfig({ ...result, messages: result.messages.length ? result.messages : [blankMessage()] }))
      .catch((e) => toast(e.message, 'err'));
  }, []);

  const updateMessage = (index, message) => setConfig((current) => ({
    ...current,
    messages: current.messages.map((item, i) => i === index ? message : item),
  }));

  const save = async () => {
    setBusy(true);
    try {
      const result = await api('/api/command-messages', { method: 'PUT', body: config });
      setConfig({ messages: result.messages, cooldownSeconds: result.cooldownSeconds, targetChannelId: result.targetChannelId });
      toast('Pengaturan /pesan disimpan', 'ok');
    } catch (e) {
      toast(e.message, 'err');
    }
    setBusy(false);
  };

  const send = async () => {
    setBusy(true);
    try {
      const result = await api('/api/command-messages/send', { method: 'POST', body: config });
      setConfig({ ...config, targetChannelId: config.targetChannelId.trim() });
      toast(`${result.sent} pesan terkirim ke #${result.channelName}`, 'ok');
    } catch (e) {
      toast(e.message, 'err');
    }
    setBusy(false);
  };

  if (!config) return <div className="empty">Memuat pengaturan command…</div>;
  const validChannelId = /^\d{17,20}$/.test((config.targetChannelId || '').trim());
  return (
    <div className="cols">
      <div>
        <div className="glass panel">
          <div className="modhead">
            <div><h3 style={{ margin: 0 }}>Pengaturan Pesan</h3><span className="hint">Atur pesan dan channel tujuan untuk pengiriman dari website.</span></div>
            <span className="spacer" />
            <button className="btn primary" disabled={busy} onClick={save}>{busy ? 'Menyimpan…' : 'Simpan pengaturan'}</button>
          </div>
          <div className="row">
            <label>ID channel tujuan</label>
            <input type="text" inputMode="numeric" value={config.targetChannelId || ''} onChange={(e) => setConfig({ ...config, targetChannelId: e.target.value.replace(/\D/g, '').slice(0, 20) })} placeholder="Tempel ID channel Discord di sini" />
            <span className="hint">Developer Mode Discord → klik kanan channel → Copy Channel ID.</span>
          </div>
          <div className="row">
            <label>Cooldown antar pengiriman dari web (detik, 5–86400)</label>
            <input type="number" min="5" max="86400" step="1" value={config.cooldownSeconds} onChange={(e) => setConfig({ ...config, cooldownSeconds: Number(e.target.value) })} />
          </div>
          <div className="hint">Kirim Pesan memakai bot pribadimu dan bisa dikirim ke channel di server mana pun yang sudah dimasuki bot itu, selama bot punya akses ke channel. Jika menjalankan /pesan sebagai slash command, Discord membalas di channel tempat command digunakan.</div>
          <div className="actions" style={{ marginTop: 14 }}>
            <button className="btn primary" disabled={busy || !validChannelId} onClick={send}>{busy ? 'Mengirim…' : 'Kirim Pesan'}</button>
            <button className="btn" disabled={busy} onClick={save}>{busy ? 'Menyimpan…' : 'Simpan Pengaturan'}</button>
          </div>
        </div>
        {config.messages.map((message, index) => (
          <div className="glass panel" key={index} style={{ marginTop: 16 }}>
            <div className="modhead">
              <h3 style={{ margin: 0 }}>Pesan {index + 1}</h3>
              <span className="spacer" />
              {config.messages.length > 1 && <button className="btn small danger" onClick={() => setConfig({ ...config, messages: config.messages.filter((_, i) => i !== index) })}>Hapus pesan</button>}
            </div>
            <Editor message={message} onChange={(next) => updateMessage(index, next)} toast={toast} assets={assets} />
          </div>
        ))}
        {config.messages.length < 5 && <button className="btn" style={{ marginTop: 16 }} onClick={() => setConfig({ ...config, messages: [...config.messages, blankMessage()] })}>Tambah pesan ({config.messages.length}/5)</button>}
        <div className="actions" style={{ marginTop: 16 }}>
          <button className="btn primary" disabled={busy} onClick={save}>{busy ? 'Menyimpan…' : 'Simpan pengaturan'}</button>
        </div>
      </div>
      <div className="preview">
        <h3 style={{ marginBottom: 12 }}>Pratinjau</h3>
        {config.messages.map((message, index) => <div key={index} style={{ marginBottom: 18 }}><p className="hint">Pesan {index + 1}</p><Preview message={message} ctx={ctx} /></div>)}
        <p className="hint">Maksimal 5 pesan per penggunaan, dikirim satu per satu dengan jeda singkat.</p>
      </div>
    </div>
  );
}

function ProfileTab({ me, initialAccount, onAccountChange, onBack, toast }) {
  const [account, setAccount] = useState(initialAccount || {});
  const [profile, setProfile] = useState({
    fullName: initialAccount?.profile?.fullName || '',
    username: initialAccount?.profile?.username || me.username || '',
    phone: initialAccount?.profile?.phone || '',
  });
  const [newEmail, setNewEmail] = useState('');
  const [newPassword, setNewPassword] = useState('');
  const [confirmPassword, setConfirmPassword] = useState('');
  const [code, setCode] = useState('');
  const [otpPurpose, setOtpPurpose] = useState('');
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    let active = true;
    api('/api/auth/account').then((result) => {
      if (!active) return;
      setAccount(result);
      setProfile({
        fullName: result.profile?.fullName || '',
        username: result.profile?.username || me.username || '',
        phone: result.profile?.phone || '',
      });
    }).catch((error) => { if (active) toast(error.message, 'err'); });
    return () => { active = false; };
  }, []);

  const saveProfile = async (event) => {
    event.preventDefault();
    setBusy(true);
    try {
      const result = await api('/api/profile', { method: 'POST', body: profile });
      const updated = { ...account, profile: result.profile };
      setAccount(updated);
      onAccountChange(updated);
      toast('Profil berhasil diperbarui.', 'ok');
    } catch (error) { toast(error.message, 'err'); }
    setBusy(false);
  };

  const requestOtp = async (event, purpose) => {
    event.preventDefault();
    setBusy(true);
    try {
      const body = purpose === 'email'
        ? { purpose, newEmail }
        : { purpose, password: newPassword, confirmPassword };
      const result = await api('/api/profile/request-otp', { method: 'POST', body });
      setOtpPurpose(purpose);
      setCode('');
      toast(result.message, 'ok');
    } catch (error) { toast(error.message, 'err'); }
    setBusy(false);
  };

  const verifyOtp = async (event) => {
    event.preventDefault();
    setBusy(true);
    try {
      const result = await api('/api/profile/verify-otp', { method: 'POST', body: { code } });
      const updated = { ...account, email: result.email, emailVerified: true };
      setAccount(updated);
      onAccountChange(updated);
      setOtpPurpose('');
      setCode('');
      setNewEmail('');
      setNewPassword('');
      setConfirmPassword('');
      toast(result.message, 'ok');
    } catch (error) { toast(error.message, 'err'); }
    setBusy(false);
  };

  const cancelOtp = () => { setOtpPurpose(''); setCode(''); };
  const avatarUrl = account.avatar || me.avatar;
  const initial = (profile.username || me.username || 'E').trim().charAt(0).toUpperCase();

  return (
    <div className="wrap profile-page">
      <button className="btn small profile-back" type="button" onClick={onBack}>← Kembali ke dashboard</button>
      <div className="profile-heading">
        <div><div className="badge">AKUN EMBED STUDIO</div><h1 className="page-title">Profil pengguna</h1><p className="sub">Kelola identitas dan keamanan akunmu di satu tempat.</p></div>
      </div>
      <div className="profile-layout">
        <section className="glass profile-hero">
          <div className="profile-avatar-wrap">
            {avatarUrl ? <img className="profile-avatar" src={avatarUrl} alt={`Avatar ${profile.username || me.username}`} /> : <div className="profile-avatar profile-avatar-fallback" aria-hidden="true">{initial}</div>}
            <span className="profile-online" aria-label="Akun Discord tertaut" title="Akun Discord tertaut" />
          </div>
          <span className="profile-eyebrow">AKUN TERTAUT</span>
          <h2>{profile.username || me.username}</h2>
          <p className="profile-discord">@{account.discordUsername || me.username} di Discord</p>
          <div className="profile-email-chip"><span className="profile-check">✓</span><span>{account.email || 'Email belum tersedia'}</span></div>
          <div className="profile-status">{account.emailVerified ? 'Email terverifikasi' : 'Email belum diverifikasi (opsional)'}</div>
          <div className="profile-hero-note"><span aria-hidden="true">✦</span><span>Avatar diambil dari akun Discord yang sudah terhubung.</span></div>
        </section>
        <div className="profile-content">
          <section className="glass panel profile-panel">
            <div className="profile-section-head"><div><h2>Informasi profil</h2><p>Perubahan nama tersimpan langsung di akun Embed Studio.</p></div><span className="profile-section-icon">✎</span></div>
            <form onSubmit={saveProfile} className="profile-form">
              <div className="profile-forms">
                <label className="row"><span>Nama lengkap</span><input type="text" autoComplete="name" maxLength="100" value={profile.fullName} onChange={(event) => setProfile((value) => ({ ...value, fullName: event.target.value }))} required /></label>
                <label className="row"><span>Username</span><input type="text" autoComplete="nickname" maxLength="32" value={profile.username} onChange={(event) => setProfile((value) => ({ ...value, username: event.target.value }))} required /></label>
              </div>
              <label className="row"><span>Nomor HP</span><input type="text" inputMode="tel" autoComplete="tel" maxLength="24" value={profile.phone} onChange={(event) => setProfile((value) => ({ ...value, phone: event.target.value }))} required /></label>
              <div className="actions"><button className="btn primary" type="submit" disabled={busy}>{busy ? 'Menyimpan…' : 'Simpan profil'}</button></div>
            </form>
          </section>
          <div className="profile-security-grid">
            <section className="glass panel profile-panel">
              <div className="profile-section-head"><div><h2>Ganti email</h2><p>Kode OTP akan dikirim ke alamat email baru.</p></div><span className="profile-section-icon">✉</span></div>
              {otpPurpose === 'email' ? (
                <form onSubmit={verifyOtp} className="profile-form">
                  <p className="profile-otp-destination">Masukkan kode 6 digit yang dikirim ke <b>{newEmail}</b>.</p>
                  <label className="row"><span>Kode OTP</span><input type="text" inputMode="numeric" autoComplete="one-time-code" pattern="[0-9]{6}" maxLength="6" value={code} onChange={(event) => setCode(event.target.value.replace(/\D/g, '').slice(0, 6))} required /></label>
                  <div className="actions"><button className="btn primary" type="submit" disabled={busy || code.length !== 6}>{busy ? 'Memverifikasi…' : 'Verifikasi & ganti email'}</button><button className="btn" type="button" onClick={cancelOtp}>Batal</button></div>
                </form>
              ) : (
                <form onSubmit={(event) => requestOtp(event, 'email')} className="profile-form">
                  <label className="row"><span>Email saat ini</span><input type="text" value={account.email || ''} readOnly /></label>
                  <label className="row"><span>Email baru</span><input type="text" inputMode="email" autoComplete="email" value={newEmail} onChange={(event) => setNewEmail(event.target.value)} placeholder="nama@email.com" required /></label>
                  <button className="btn" type="submit" disabled={busy}>{busy ? 'Mengirim kode…' : 'Kirim kode verifikasi'}</button>
                </form>
              )}
            </section>
            <section className="glass panel profile-panel">
              <div className="profile-section-head"><div><h2>Ganti password</h2><p>Verifikasi perubahan lewat OTP ke email akun saat ini.</p></div><span className="profile-section-icon">⌑</span></div>
              {otpPurpose === 'password' ? (
                <form onSubmit={verifyOtp} className="profile-form">
                  <p className="profile-otp-destination">Masukkan kode 6 digit yang dikirim ke <b>{account.email}</b>.</p>
                  <label className="row"><span>Kode OTP</span><input type="text" inputMode="numeric" autoComplete="one-time-code" pattern="[0-9]{6}" maxLength="6" value={code} onChange={(event) => setCode(event.target.value.replace(/\D/g, '').slice(0, 6))} required /></label>
                  <div className="actions"><button className="btn primary" type="submit" disabled={busy || code.length !== 6}>{busy ? 'Memverifikasi…' : 'Verifikasi & ganti password'}</button><button className="btn" type="button" onClick={cancelOtp}>Batal</button></div>
                </form>
              ) : (
                <form onSubmit={(event) => requestOtp(event, 'password')} className="profile-form">
                  <label className="row"><span>Password baru</span><input type="password" autoComplete="new-password" minLength="12" maxLength="256" value={newPassword} onChange={(event) => setNewPassword(event.target.value)} required /></label>
                  <label className="row"><span>Ulangi password baru</span><input type="password" autoComplete="new-password" minLength="12" maxLength="256" value={confirmPassword} onChange={(event) => setConfirmPassword(event.target.value)} required /></label>
                  <p className="profile-password-hint">Minimal 12 karakter. Password baru disimpan setelah OTP benar.</p>
                  <button className="btn" type="submit" disabled={busy || newPassword.length < 12 || newPassword !== confirmPassword}>{busy ? 'Mengirim kode…' : 'Kirim OTP ke email saya'}</button>
                </form>
              )}
            </section>
          </div>
        </div>
      </div>
    </div>
  );
}

function formatMetricBytes(bytes) {
  if (!Number.isFinite(bytes)) return '—';
  const units = ['B', 'KB', 'MB', 'GB', 'TB'];
  let value = bytes;
  let unit = 0;
  while (value >= 1024 && unit < units.length - 1) {
    value /= 1024;
    unit += 1;
  }
  return `${value.toFixed(unit > 0 && value < 10 ? 1 : 0)} ${units[unit]}`;
}

function HealthSparkline({ values, color }) {
  const width = 120;
  const height = 32;
  const points = values.length > 1
    ? values.map((value, index) => `${(index / (values.length - 1)) * width},${height - Math.min(100, Math.max(0, value)) / 100 * height}`).join(' ')
    : '';
  return <svg className="health-sparkline" viewBox={`0 0 ${width} ${height}`} aria-hidden="true">
    {points && <polyline points={points} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />}
  </svg>;
}

function HealthMetric({ label, value, detail, percent, trend, color = '#2563eb' }) {
  const boundedPercent = Number.isFinite(percent) ? Math.max(0, Math.min(100, percent)) : null;
  return <article className="health-metric">
    <div className="health-metric-head"><span>{label}</span>{trend && <HealthSparkline values={trend} color={color} />}</div>
    <strong>{value}</strong>
    {detail && <small>{detail}</small>}
    {boundedPercent !== null && <div className="health-meter" role="meter" aria-label={label} aria-valuemin="0" aria-valuemax="100" aria-valuenow={Math.round(boundedPercent)}><i style={{ width: `${boundedPercent}%`, background: color }} /></div>}
  </article>;
}

function SystemHealthPanel() {
  const [metrics, setMetrics] = useState(null);
  const [error, setError] = useState('');
  const [history, setHistory] = useState({ cpu: [], memory: [], disk: [] });
  const [refreshing, setRefreshing] = useState(true);
  const requestRef = useRef(false);

  useEffect(() => {
    let active = true;
    const refresh = async () => {
      if (requestRef.current || document.visibilityState === 'hidden') return;
      requestRef.current = true;
      try {
        const result = await api('/api/owner/health', { cache: 'no-store' });
        if (!active) return;
        setMetrics(result);
        setError('');
        setHistory((current) => ({
          cpu: [...current.cpu, result.cpu.processPercent ?? 0].slice(-30),
          memory: [...current.memory, result.memory.process.rssBytes / result.memory.system.totalBytes * 100].slice(-30),
          disk: [...current.disk, result.disk.usagePercent ?? 0].slice(-30),
        }));
      } catch (requestError) {
        if (active) setError(requestError.message);
      } finally {
        requestRef.current = false;
        if (active) setRefreshing(false);
      }
    };
    void refresh();
    const timer = setInterval(refresh, 5000);
    return () => {
      active = false;
      clearInterval(timer);
    };
  }, []);

  if (!metrics) return <section className="health-panel glass" aria-live="polite">
    <div className="health-panel-title"><div><span className="badge">PEMANTAUAN LANGSUNG</span><h3>Stabilitas server</h3></div><span className="health-pulse" /></div>
    {error ? <p className="health-error" role="alert">{error}</p> : <p className="hint">{refreshing ? 'Mengambil metrik dari server…' : 'Menunggu data metrik…'}</p>}
  </section>;

  const cpu = metrics.cpu.processPercent;
  const memoryPercent = metrics.memory.system.usagePercent;
  const diskPercent = metrics.disk.usagePercent;
  const eventLoopP95 = metrics.eventLoop.p95DelayMs;
  const httpErrorRate = metrics.http.serverErrorRate;
  const critical = (cpu !== null && cpu >= 95)
    || (memoryPercent !== null && memoryPercent >= 95)
    || (diskPercent !== null && diskPercent >= 95)
    || (eventLoopP95 !== null && eventLoopP95 >= 500)
    || (metrics.http.requests >= 10 && httpErrorRate >= 0.25);
  const warning = !critical && (
    (cpu !== null && cpu >= 80)
    || (memoryPercent !== null && memoryPercent >= 85)
    || (diskPercent !== null && diskPercent >= 85)
    || (eventLoopP95 !== null && eventLoopP95 >= 150)
    || (metrics.http.requests >= 10 && httpErrorRate >= 0.05)
  );
  const statusLabel = critical ? 'Perlu perhatian' : warning ? 'Perlu dipantau' : 'Berjalan normal';
  const statusClass = critical ? 'critical' : warning ? 'warning' : 'healthy';
  const cpuLabel = cpu === null ? 'Mengumpulkan…' : `${cpu.toFixed(1)}%`;
  const rss = metrics.memory.process.rssBytes;
  const diskDetail = metrics.disk.available
    ? `${formatMetricBytes(metrics.disk.freeBytes)} tersedia dari ${formatMetricBytes(metrics.disk.totalBytes)}`
    : `Tidak tersedia${metrics.disk.error ? `: ${metrics.disk.error}` : ' pada platform ini'}`;
  const eventLoopLabel = eventLoopP95 === null ? '—' : `${eventLoopP95.toFixed(1)} ms`;

  return <section className="health-panel glass">
    <div className="health-panel-title">
      <div><span className="badge">PEMANTAUAN LANGSUNG · PEMILIK</span><h3>Stabilitas server</h3><p className="hint">Diperbarui otomatis setiap 5 detik. Hanya dapat dilihat pemilik website.</p></div>
      <div className={`health-status ${statusClass}`}><i />{statusLabel}</div>
    </div>
    {error && <p className="health-error" role="alert">Pembaruan gagal: {error} · menampilkan data terakhir yang berhasil diterima.</p>}
    <div className="health-metrics">
      <HealthMetric label="CPU aplikasi" value={cpuLabel} detail="Proses Node.js" percent={cpu} trend={history.cpu} color="#3478f6" />
      <HealthMetric label="CPU sistem" value={metrics.cpu.systemPercent === null ? '—' : `${metrics.cpu.systemPercent.toFixed(1)}%`} detail={`${metrics.cpu.cores} core · ${metrics.cpu.loadAverage ? `load ${metrics.cpu.loadAverage.map((value) => value.toFixed(2)).join(' / ')}` : 'load tidak tersedia'}`} percent={metrics.cpu.systemPercent} color="#8b5cf6" />
      <HealthMetric label="RAM aplikasi" value={formatMetricBytes(rss)} detail={`Heap ${formatMetricBytes(metrics.memory.process.heapUsedBytes)} / ${formatMetricBytes(metrics.memory.process.heapTotalBytes)} · eksternal ${formatMetricBytes(metrics.memory.process.externalBytes)}`} percent={rss / metrics.memory.system.totalBytes * 100} trend={history.memory} color="#06a6a6" />
      <HealthMetric label="RAM host" value={memoryPercent === null ? '—' : `${memoryPercent.toFixed(1)}%`} detail={`${formatMetricBytes(metrics.memory.system.usedBytes)} / ${formatMetricBytes(metrics.memory.system.totalBytes)} · ${metrics.memory.system.source}`} percent={memoryPercent} color="#10a36d" />
      <HealthMetric label="Penyimpanan disk" value={metrics.disk.available && diskPercent !== null ? `${diskPercent.toFixed(1)}% terpakai` : 'Tidak tersedia'} detail={diskDetail} percent={diskPercent} trend={history.disk} color="#e59b24" />
      <HealthMetric label="Respons event loop" value={eventLoopLabel} detail={`Puncak ${metrics.eventLoop.maxDelayMs === null ? '—' : `${metrics.eventLoop.maxDelayMs.toFixed(1)} ms`}`} />
      <HealthMetric label="Latency web (p95)" value={`${metrics.http.p95LatencyMs.toFixed(0)} ms`} detail={`${metrics.http.requests} permintaan · rata-rata ${metrics.http.averageLatencyMs.toFixed(0)} ms · 5 menit`} />
      <HealthMetric label="Error server HTTP" value={`${(httpErrorRate * 100).toFixed(1)}%`} detail={`${metrics.http.serverErrors} dari ${metrics.http.requests} permintaan · 5 menit`} />
      <HealthMetric label="Bot Discord" value={`${metrics.bots.connected} / ${metrics.bots.configured} terhubung`} detail={`${metrics.bots.guilds} server · ${metrics.bots.averagePingMs === null ? 'belum ada ping' : `Gateway ${metrics.bots.averagePingMs.toFixed(0)} ms`}${metrics.bots.disconnected ? ` · ${metrics.bots.disconnected} offline` : ''}`} />
    </div>
    <div className="health-runtime">
      <span><b>Node</b> {metrics.runtime.nodeVersion} · {metrics.runtime.platform}/{metrics.runtime.architecture}</span>
      <span><b>Uptime aplikasi</b> {formatHealthDuration(metrics.runtime.processUptimeSeconds)}</span>
      <span><b>Uptime host</b> {formatHealthDuration(metrics.runtime.hostUptimeSeconds)}</span>
      <span><b>Sampel</b> {new Date(metrics.sampledAt).toLocaleTimeString('id-ID')}</span>
    </div>
  </section>;
}

function formatHealthDuration(seconds) {
  if (!Number.isFinite(seconds)) return '—';
  const days = Math.floor(seconds / 86400);
  const hours = Math.floor((seconds % 86400) / 3600);
  const minutes = Math.floor((seconds % 3600) / 60);
  return [days ? `${days}h` : '', hours ? `${hours}j` : '', `${minutes}m`].filter(Boolean).join(' ');
}

        <li>Pilih <b>Undang bot ke server</b> untuk memasang bot sebagai anggota server. Tautan ini meminta <b>Administrator</b>, izin yang memberi akses luas; untuk mengirim pesan saja cukup berikan View Channel dan Send Messages. Atau pilih <b>Tambah aplikasi ke akun pengguna</b> agar aplikasi/command tersedia tanpa bot menjadi anggota server; aktifkan User Install di Developer Portal → Installation.</li>
