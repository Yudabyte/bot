      setLoginError(error.message);
      setLoginBusy(false);
    }
  };
  const requestPasswordReset = async (event) => {
    event.preventDefault();
    setLoginBusy(true);
    setLoginError('');
    setAuthNotice('');
    try {
      const result = await api('/auth/password-reset/request', {
        method: 'POST',
        body: { email: passwordReset.email },
      });
      setAuthNotice(result.message);
      setAuthMode('reset-verify');
    } catch (error) {
      setLoginError(error.message);
    } finally {
      setLoginBusy(false);
    }
  };
  const verifyPasswordReset = async (event) => {
    event.preventDefault();
    setLoginBusy(true);
    setLoginError('');
    try {
      const result = await api('/auth/password-reset/verify', {
        method: 'POST',
        body: passwordReset,
      });
      setWebsiteLogin((current) => ({ ...current, email: passwordReset.email, password: '' }));
      setPasswordReset({ email: passwordReset.email, code: '', password: '', confirmPassword: '' });
      setAuthNotice(result.message);
      setAuthMode('login');
    } catch (error) {
      setLoginError(error.message);
    } finally {
      setLoginBusy(false);
    }
  };
  const connectPersonalApp = async (event) => {
    event.preventDefault();
    setLoginBusy(true);
    setLoginError('');
    try {
      await api('/auth/setup', { method: 'POST', body: loginCredentials });
      location.assign('/auth/login');
    } catch (error) {
      setLoginError(error.message);
      setLoginBusy(false);
    }
  };
  useEffect(() => { api('/api/me').then((r) => setState({ loading: false, ...r })).catch((error) => setState({ loading: false, user: null, serverError: error.message })); }, []);
  useEffect(() => {
    if (!state.user) return;
    let active = true;
    api('/api/guilds')
      .then((result) => { if (active) setGuilds(result); })
      .catch((error) => { if (active) toast(error.message, 'err'); });
    return () => { active = false; };
  }, [state.user, state.botConfigured]);

  if (state.loading) return <div className="loading">Memuat…</div>;

  if (!state.user) return (
    <div className="login">
      <div>
        <div className="login-layout">
          <section className="login-intro">
            <div className="glass login-brand">
              <div className="logo">E</div>
              <div>
                <div className="login-brand-title">Embed Studio</div>
                <div className="login-brand-caption">DISCORD CREATOR DASHBOARD</div>
              </div>
            </div>
            <h1>Pesan Discord, dirancang dengan mudah.</h1>
            <p>Daftar atau masuk dengan email dan password, lalu hubungkan aplikasi dan bot Discord milikmu sendiri.</p>
            <div className="login-feature-list">
              <div className="login-feature">
                <div className="login-feature-icon">✦</div>
                <div><b>Editor pesan visual</b><span>Rancang embed, tombol, gambar, dan template.</span></div>
              </div>
              <div className="login-feature">
                <div className="login-feature-icon">↗</div>
                <div><b>Gunakan bot milikmu</b><span>Masukkan Application ID, Client Secret, dan Bot Token dari Developer Portal.</span></div>
              </div>
              <div className="login-feature">
                <div className="login-feature-icon">⌘</div>
                <div><b>Kelola server yang kamu miliki</b><span>Masuk dengan Discord untuk membuka dashboard server.</span></div>
              </div>
            </div>
          </section>
          <section className="glass login-card">
            {state.websiteAccount ? <>
              <div className="badge" style={{ marginBottom: 16 }}>LANGKAH 2 • HUBUNGKAN BOT</div>
              <h2>Halo, {state.websiteAccount.profile?.fullName || state.websiteAccount.email}</h2>
              <p>{state.websiteAccount.emailVerified ? 'Email kamu sudah terverifikasi.' : 'Email dapat dipakai untuk login; verifikasi hanya diperlukan untuk fitur pemulihan dan perubahan email.'} Masukkan kredensial aplikasi bot milikmu untuk menyelesaikan penyiapan.</p>
              <form onSubmit={connectPersonalApp} className="auth-step">
                <label className="row"><span>Application ID / Client ID</span><input type="text" inputMode="numeric" autoComplete="off" value={loginCredentials.clientId} onChange={(event) => updateLoginCredential('clientId', event.target.value.replace(/\D/g, '').slice(0, 20))} placeholder="ID aplikasi dari General Information" required /></label>
                <label className="row"><span>Client Secret</span><SecretInput label="Client Secret" autoComplete="new-password" value={loginCredentials.clientSecret} onChange={(event) => updateLoginCredential('clientSecret', event.target.value)} placeholder="OAuth2 → Client Secret" required /></label>
                <label className="row"><span>Bot Token</span><SecretInput label="Bot Token" autoComplete="new-password" value={loginCredentials.botToken} onChange={(event) => updateLoginCredential('botToken', event.target.value)} placeholder="Bot → Reset Token / Copy" required /></label>
                <p className="hint" style={{ overflowWrap: 'anywhere' }}>Tambahkan Redirect URI ini di Developer Portal → OAuth2: <code>{location.origin}/auth/callback</code></p>
                {(loginError || state.serverError) && <p role="alert" className="toast err" style={{ position: 'static' }}>{loginError || state.serverError}</p>}
                <button className="btn primary" type="submit" disabled={loginBusy}>{loginBusy ? 'Memvalidasi kredensial…' : 'Verifikasi bot & lanjutkan'}</button>
              </form>
              <DiscordBotIntentGuide clientId={loginCredentials.clientId} />
              <div className="login-security-note">
                <span className="login-security-icon" aria-hidden="true">●</span>
                <span><b>Rahasia tidak ditampilkan kembali.</b> Token bot dan Client Secret disimpan terenkripsi khusus akunmu, bukan di file `.env` bersama.</span>
              </div>
            </> : <>
              <div className="badge" style={{ marginBottom: 16 }}>AKUN EMBED STUDIO</div>
              {authMode !== 'reset-verify' && <div className="auth-switch" role="tablist" aria-label="Pilih masuk atau daftar">
                <button type="button" className={authMode === 'login' ? 'on' : ''} onClick={() => { setAuthMode('login'); setLoginError(''); }}>Masuk</button>
                <button type="button" className={authMode === 'register' ? 'on' : ''} onClick={() => { setAuthMode('register'); setLoginError(''); }}>Daftar</button>
              </div>}
              {authMode === 'login' ? <>
                <h2>Masuk kembali</h2>
                <p>Masuk dengan email dan password. Bot serta pengaturan Discord kamu akan dimuat kembali.</p>
                {authNotice && <p className="hint" role="status">{authNotice}</p>}
                <form onSubmit={loginWithWebsiteAccount} className="auth-step">
                  <label className="row"><span>Email</span><input type="email" name="username" autoComplete="username" value={websiteLogin.email} onChange={(event) => setWebsiteLogin((current) => ({ ...current, email: event.target.value }))} placeholder="nama@email.com" required maxLength={254} /></label>
                  <label className="row"><span>Password</span><SecretInput label="Password akun website" name="current-password" autoComplete="current-password" value={websiteLogin.password} onChange={(event) => setWebsiteLogin((current) => ({ ...current, password: event.target.value }))} placeholder="Password akun website" required maxLength={256} /></label>
                  <label className="toggle"><input type="checkbox" checked={websiteLogin.remember} onChange={(event) => setWebsiteLogin((current) => ({ ...current, remember: event.target.checked }))} /> Ingat saya di perangkat ini</label>
                  {loginError && <p role="alert" className="toast err" style={{ position: 'static' }}>{loginError}</p>}
                  <button className="btn primary" type="submit" disabled={loginBusy || !websiteLogin.email || !websiteLogin.password}>{loginBusy ? 'Memeriksa…' : 'Masuk'}</button>
                  <button className="btn" type="button" disabled={loginBusy} onClick={() => {
                    setPasswordReset((current) => ({ ...current, email: websiteLogin.email }));
                    setLoginError('');
                    setAuthNotice('');
                    setAuthMode('reset');
                  }}>Lupa password?</button>
                </form>
                <p className="hint">Browser dapat menawarkan menyimpan email dan password di password manager jika kamu menyetujuinya. Embed Studio tidak menyimpan password asli.</p>
              </> : authMode === 'reset' ? <>
                <h2>Reset password</h2>
                <p>Masukkan email akun. Jika terdaftar, kami kirim kode verifikasi untuk membuat password baru.</p>
                <form onSubmit={requestPasswordReset} className="auth-step">
                  <label className="row"><span>Email akun</span><input type="email" name="username" autoComplete="username" value={passwordReset.email} onChange={(event) => setPasswordReset((current) => ({ ...current, email: event.target.value }))} placeholder="nama@email.com" required maxLength={254} /></label>
                  {loginError && <p role="alert" className="toast err" style={{ position: 'static' }}>{loginError}</p>}
                  <button className="btn primary" type="submit" disabled={loginBusy || !passwordReset.email}>{loginBusy ? 'Memproses…' : 'Kirim kode reset'}</button>
                  <button className="btn" type="button" disabled={loginBusy} onClick={() => { setAuthMode('login'); setLoginError(''); }}>Kembali ke login</button>
                </form>
              </> : authMode === 'reset-verify' ? <>
                <h2>Buat password baru</h2>
                <p>Kode enam digit dikirim ke <b>{passwordReset.email}</b> jika email terdaftar. Kode berlaku 10 menit.</p>
                {authNotice && <p className="hint" role="status">{authNotice}</p>}
                <form onSubmit={verifyPasswordReset} className="auth-step">
                  <label className="row"><span>Kode OTP</span><input type="text" inputMode="numeric" autoComplete="one-time-code" value={passwordReset.code} onChange={(event) => setPasswordReset((current) => ({ ...current, code: event.target.value.replace(/\D/g, '').slice(0, 6) }))} placeholder="6 digit" required maxLength={6} /></label>
                  <label className="row"><span>Password baru</span><SecretInput label="Password baru" autoComplete="new-password" value={passwordReset.password} onChange={(event) => setPasswordReset((current) => ({ ...current, password: event.target.value }))} placeholder="Minimal 12 karakter" required minLength={12} maxLength={256} /></label>
                  <label className="row"><span>Ulangi password baru</span><SecretInput label="Ulangi password baru" autoComplete="new-password" value={passwordReset.confirmPassword} onChange={(event) => setPasswordReset((current) => ({ ...current, confirmPassword: event.target.value }))} placeholder="Ketik ulang password baru" required minLength={12} maxLength={256} /></label>
                  {loginError && <p role="alert" className="toast err" style={{ position: 'static' }}>{loginError}</p>}
                  <button className="btn primary" type="submit" disabled={loginBusy || passwordReset.code.length !== 6 || passwordReset.password.length < 12 || passwordReset.password !== passwordReset.confirmPassword}>{loginBusy ? 'Menyimpan…' : 'Simpan password baru'}</button>
                  <button className="btn" type="button" disabled={loginBusy} onClick={() => { setAuthMode('reset'); setLoginError(''); }}>Kirim kode baru</button>
                </form>
              </> : <>
                <h2>Buat akun baru</h2>
                <p>Daftar langsung dengan email dan password. Nama dan nomor HP bisa dilengkapi nanti di profil.</p>
                <form onSubmit={registerWebsiteAccount} className="auth-step">
                  <label className="row"><span>Email</span><input type="email" autoComplete="email" value={registration.email} onChange={(event) => setRegistration((current) => ({ ...current, email: event.target.value }))} placeholder="nama@email.com" required maxLength={254} /></label>
                  <label className="row"><span>Password</span><SecretInput label="Buat password" autoComplete="new-password" value={registration.password} onChange={(event) => setRegistration((current) => ({ ...current, password: event.target.value }))} placeholder="Minimal 12 karakter" required minLength={12} maxLength={256} /></label>
                  <label className="row"><span>Ulangi password</span><SecretInput label="Ulangi password" autoComplete="new-password" value={registration.confirmPassword} onChange={(event) => setRegistration((current) => ({ ...current, confirmPassword: event.target.value }))} placeholder="Ketik ulang password" required minLength={12} maxLength={256} /></label>
                  {loginError && <p role="alert" className="toast err" style={{ position: 'static' }}>{loginError}</p>}
                  <button className="btn primary" type="submit" disabled={loginBusy || registration.password.length < 12 || registration.password !== registration.confirmPassword}>{loginBusy ? 'Membuat akun…' : 'Daftar'}</button>
                  <p className="hint">Password harus 12–256 karakter. Email tidak diverifikasi saat pendaftaran; OTP hanya digunakan untuk reset password.</p>
                </form>
              </>}
            </>}
          </section>
        </div>
        <div className="login-footer">Embed Studio • Login email/password • Bot pribadi terhubung melalui Discord OAuth2</div>
      </div>
    </div>
  );

  const bot = { name: state.botName, avatar: state.botAvatar };
  const logout = async () => { await api('/auth/logout', { method: 'POST' }); location.reload(); };
  const updateProfileAccount = (account) => {
    if (!account) return;
    setState((current) => ({
      ...current,
      user: { ...current.user, username: account.profile?.username || current.user.username },
      websiteAccount: {
        ...current.websiteAccount,
        email: account.email,
        profile: account.profile,
        emailVerified: account.emailVerified,
      },
    }));
  };

  return (
    <>
      <header className="top">
        <div className="brand"><i>E</i>Embed Studio</div>
        <span className="spacer" />
        <button className="me profile-trigger" type="button" aria-label="Buka profil pengguna" aria-current={profileOpen ? 'page' : undefined} onClick={() => { setProfileOpen(true); setSettingsOpen(false); setCommandMessagesOpen(false); }}>
          {state.user.avatar ? <img src={state.user.avatar} alt="" /> : <span className="profile-avatar-fallback profile-header-fallback" aria-hidden="true">{state.user.username?.charAt(0).toUpperCase() || 'E'}</span>}
          <span>{state.user.username}</span>
        </button>
        {!guild && <button className="btn small" onClick={() => { setCommandMessagesOpen((open) => !open); setSettingsOpen(false); }}>{commandMessagesOpen ? 'Pilih server' : 'Atur /pesan'}</button>}
        {!guild && <button className="btn small" onClick={() => { setSettingsOpen((open) => !open); setCommandMessagesOpen(false); }}>{settingsOpen ? 'Pilih server' : 'Pengaturan'}</button>}
        <button className="btn small" onClick={() => state.botConfigured ? setInviteOpen(true) : setSettingsOpen(true)}>{state.botConfigured ? 'Undang bot' : 'Hubungkan bot'}</button>
        <button className="btn small" onClick={logout}>Keluar</button>
      </header>
      {profileOpen ? <ProfileTab me={state.user} initialAccount={state.websiteAccount} onAccountChange={updateProfileAccount} onBack={() => setProfileOpen(false)} toast={toast} /> : guild ? <Studio guild={guild} me={state.user} bot={bot} allGuilds={guilds?.guilds || []} owner={state.owner} onBack={() => setGuild(null)} toast={toast} /> : settingsOpen ? (
        <div className="wrap">
          <h2 className="page-title">Pengaturan</h2>
          <p className="sub">Kelola koneksi bot dan ikuti panduan penggunaan Embed Studio.</p>
          {state.owner && <SystemHealthPanel />}
          <SettingsTab me={state.user} toast={toast} onBotConfiguredChange={(changes) => setState((current) => ({ ...current, ...changes }))} />
        </div>
      ) : commandMessagesOpen ? (
        <div className="wrap">
          <h2 className="page-title">Command /pesan</h2>
          <p className="sub">Atur desain pesan, tempel ID channel, lalu kirim dari website.</p>
          <CommandMessagesTab me={state.user} toast={toast} />
        </div>
      ) : (
        <div className="wrap">
          {guilds && <EmojiManager guilds={guilds} toast={toast} />}
          <h2 className="page-title">Pilih server</h2>
          <p className="sub">Pilih server untuk membuka dashboard, atau tambahkan bot langsung ke server yang kamu kelola.</p>
          {!guilds ? <div className="empty">Memuat server…</div> : guilds.guilds.length === 0 ? (
            <div className="glass empty">Belum ada server yang bisa dikelola. {state.botConfigured ? 'Undang bot ke servermu, lalu muat ulang halaman.' : 'Hubungkan bot milikmu lewat Pengaturan terlebih dahulu.'}<br />{state.botConfigured ? <a href={guilds.inviteUrl} target="_blank" rel="noreferrer"><button className="btn primary">Undang bot</button></a> : <button className="btn primary" onClick={() => setSettingsOpen(true)}>Buka Pengaturan bot</button>}</div>
          ) : (
            <>
              <div className="guilds">
                {guilds.guilds.map((g) => g.botIn ? (
                  <button key={g.id} className="glass guild" onClick={() => setGuild(g)}>
                    <div className="gicon">{g.icon ? <img src={g.icon} alt="" /> : g.name[0]}</div>
                    <div><b>{g.name}</b><br /><small>{g.memberCount ?? '—'} anggota • Bot aktif</small></div>
                  </button>
                ) : (
                  <div key={g.id} className="glass guild">
                    <div className="gicon">{g.icon ? <img src={g.icon} alt="" /> : g.name[0]}</div>
                    <div><b>{g.name}</b><br /><small>Bot belum ditambahkan</small></div>
                    {state.botConfigured
                      ? <a className="btn primary" href={g.inviteUrl || `/invite?guild_id=${encodeURIComponent(g.id)}`} target="_blank" rel="noreferrer">Tambahkan bot ke sini</a>
                      : <button className="btn primary" onClick={() => setSettingsOpen(true)}>Hubungkan bot dulu</button>}
                  </div>
                ))}
              </div>
              <p className="hint" style={{ marginTop: 20 }}>Server kamu belum muncul? {state.botConfigured ? <><a href={guilds.inviteUrl} target="_blank" rel="noreferrer" style={{ color: 'var(--cyan)' }}>Undang bot</a>, lalu muat ulang halaman.</> : 'Hubungkan bot milikmu di Pengaturan terlebih dahulu.'}</p>
            </>
          )}
        </div>
      )}
      {toastMsg && <div className={'toast ' + toastMsg.type} role="status">{toastMsg.msg}</div>}
      {inviteOpen && guilds?.shareUrl && <InviteDialog url={guilds.shareUrl} appUrl={guilds.appInstallUrl} onClose={() => setInviteOpen(false)} toast={toast} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
